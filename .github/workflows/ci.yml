name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile (syntax lint)
        run: python -m compileall -q src tests bench
      - name: Validate artifacts are well-formed JSON
        run: python -c "import json; [json.load(open(f)) for f in ('ecosystem_manifest.json','capability_graph.json')]"
      - name: Policy invariant, orchestration + adversarial tests
        run: python -m unittest discover -s tests -t . -v
      - name: Mutation check (each disabled guard must fail the suite)
        if: matrix.python == '3.13'
        run: bash scripts/mutation_check.sh
      - name: Overhead benchmark (informational)
        if: matrix.python == '3.13'
        run: |
          python bench/bench_control_plane.py 200
          python bench/bench_orchestrator.py 100
          python bench/bench_tools.py 50
      - name: No leaked worker processes
        run: |
          python -m unittest tests.test_subprocess_handler >/dev/null 2>&1
          sleep 1
          if pgrep -f "sleep 60"; then echo "leaked worker children"; exit 1; fi
          echo "no leaked worker processes"
