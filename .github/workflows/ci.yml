name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45  # cycle-005: 54 mutants x full suite (I-0014)
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install and probe the OS worker sandbox (bubblewrap; justified in D-0013 / R-0009)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap
          bwrap --version
          sysctl kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo "apparmor userns sysctl: absent"
          probe() { bwrap --unshare-user --unshare-pid --unshare-net --ro-bind /usr /usr \
                      --symlink usr/lib /lib --symlink usr/lib64 /lib64 --symlink usr/bin /bin \
                      --proc /proc --dev /dev true; }
          if probe; then
            echo "SANDBOX_CI_PROBE=unprivileged_userns_ok"
          else
            # Ubuntu 24.04 AppArmor can block unprivileged user namespaces. Relax it on this
            # ephemeral runner only; production hosts must allow userns for bwrap or tools fail closed.
            echo "SANDBOX_CI_PROBE=blocked_relaxing_apparmor_userns_restriction"
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            probe
          fi
          python -c "import sys; sys.path.insert(0, 'src'); from tools import Sandbox; print('SANDBOX', Sandbox.detect())"
      - name: Compile (syntax lint)
        run: python -m compileall -q src tests bench
      - name: Validate artifacts are well-formed JSON
        run: python -c "import json; [json.load(open(f)) for f in ('ecosystem_manifest.json','capability_graph.json')]"
      - name: Policy invariant, orchestration + adversarial tests
        run: python -m unittest discover -s tests -t . -v
      - name: No leaked worker processes (runs before the mutation check, which kills mutants' strays)
        run: |
          python -m unittest tests.test_subprocess_handler >/dev/null 2>&1
          sleep 1
          python -m unittest tests.test_sandbox_adversarial tests.test_egress_adversarial >/dev/null 2>&1
          sleep 1
          if pgrep -fx "sleep 35(99|98|97|96)" || pgrep -f "/worker/worker.py"; then echo "leaked worker children"; exit 1; fi
          echo "no leaked worker processes"
      - name: Mutation check (each disabled guard must fail the suite)
        if: matrix.python == '3.13'
        run: bash scripts/mutation_check.sh
      - name: Overhead benchmark (informational)
        if: matrix.python == '3.13'
        run: |
          python bench/bench_control_plane.py 200
          python bench/bench_orchestrator.py 100
          python bench/bench_tools.py 50
          python bench/bench_browser.py 30
